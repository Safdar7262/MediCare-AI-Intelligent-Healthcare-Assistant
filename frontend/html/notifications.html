<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications – MediCare AI</title>
<meta name="description" content="MediCare AI — find a doctor, book appointments and ask general health questions in one place." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="shell">
  <div id="sidebar-container"></div>
  <div class="shell-main">
    <div id="topbar-container"></div>
    <main id="main" class="page">

      <div class="page-head">
        <div><h1 class="page-title">Notifications</h1><p class="page-sub">Appointment requests, confirmations and changes.</p></div>
        <button type="button" id="mark-all" class="btn btn-secondary" disabled><i data-icon="check" data-size="18"></i>Mark all as read</button>
      </div>
      <section class="card" style="max-width:820px">
        <div class="px-4 pt-2"><div class="tabs" role="tablist" aria-label="Filter notifications" id="notif-tabs">
          <button class="tab" role="tab" data-tab="all" aria-selected="true">All</button>
          <button class="tab" role="tab" data-tab="unread" aria-selected="false" tabindex="-1">Unread<span class="count" id="unread-count">0</span></button>
        </div></div>
        <div id="notifications-list" aria-busy="true"></div>
      </section>
    </main>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/components.js"></script>
<script src="../js/notifications.js"></script>
<script>initNotificationsPage();</script>
</body>
</html>

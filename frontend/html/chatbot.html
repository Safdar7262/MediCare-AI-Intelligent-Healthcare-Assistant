<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI assistant – MediCare AI</title>
<meta name="description" content="MediCare AI — find a doctor, book appointments and ask general health questions in one place." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="shell">
  <div id="sidebar-container"></div>
  <div class="shell-main">
    <div id="topbar-container"></div>
    <main id="main" class="chat-page">
      <aside class="chat-history lg-up" aria-label="Past conversations" style="width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column">
        <div class="p-4" style="border-bottom:1px solid var(--line)"><button type="button" class="btn btn-primary btn-block" data-chat-reset><i data-icon="plus" data-size="18"></i>New conversation</button></div>
        <p class="text-xs font-semibold text-faint" style="margin:14px 16px 4px">Past conversations</p>
        <div id="session-list" class="flex-1 overflow-y-auto p-2"><div class="skeleton" style="height:48px;margin:6px"></div></div>
      </aside>

      <section id="chat-root" class="flex-1 flex flex-col min-w-0" aria-label="Conversation with the AI assistant">
        <div class="flex items-center justify-between gap-2 px-4 lg:px-6" style="height:56px;background:var(--surface);border-bottom:1px solid var(--line)">
          <div class="flex items-center gap-2 min-w-0"><span class="brand-glyph"><i data-icon="bot" data-size="18"></i></span>
            <div class="leading-tight"><h1 class="text-base font-bold" style="margin:0">AI assistant</h1><p class="text-xs text-muted" style="margin:0">General information, not medical advice</p></div></div>
          <div class="flex gap-2 lg-down">
            <button type="button" class="btn btn-secondary btn-sm" id="history-toggle" aria-expanded="false" aria-controls="history-panel"><i data-icon="history" data-size="16"></i>History</button>
            <button type="button" class="btn btn-secondary btn-sm" data-chat-reset><i data-icon="plus" data-size="16"></i>New</button>
          </div>
        </div>
        <div id="history-panel" class="hidden card lg-down" style="margin:12px 16px 0"><div id="session-list-mobile" class="p-2" style="max-height:260px;overflow-y:auto"></div></div>
        <div class="flex-1 overflow-y-auto" style="min-height:0"><div class="chat-inner" style="max-width:780px;margin:0 auto;padding:20px 16px"><div class="chat-log" data-chat-log role="log" aria-live="polite" aria-label="Conversation"></div></div></div>
        <div style="max-width:780px;width:100%;margin:0 auto;padding:0 16px 10px"><div class="flex flex-wrap gap-2" data-chat-starters></div></div>
        <div style="background:var(--surface);border-top:1px solid var(--line)">
          <form class="composer" data-chat-form autocomplete="off" style="max-width:780px;margin:0 auto;border-top:0">
            <button type="button" class="btn btn-secondary btn-icon" data-chat-mic aria-label="Dictate your message" aria-pressed="false"><i data-icon="mic" data-size="20"></i></button>
            <label for="chat-input" class="sr-only">Message</label>
            <textarea id="chat-input" class="input" data-chat-input rows="1" maxlength="2000" placeholder="Ask a question. Press Enter to send, Shift+Enter for a new line."></textarea>
            <button type="submit" class="btn btn-primary btn-icon" data-chat-send aria-label="Send message"><i data-icon="send" data-size="20"></i></button>
          </form>
          <p class="text-xs text-faint text-center" style="margin:0;padding:0 16px 12px">MediCare AI gives general guidance only and is not a substitute for professional medical advice. In an emergency, call 112.</p>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="../js/icons.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/components.js"></script>
<script src="../js/chat.js"></script>
<script>initChatbotPage();</script>
</body>
</html>
